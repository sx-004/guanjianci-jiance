name: tmp-anysearch-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 强制走 Anysearch 兜底
        env:
          ANYSEARCH_KEYS: ${{ secrets.ANYSEARCH_KEYS }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          sys.path.insert(0, ".")
          keys = [k.strip() for k in os.environ.get("ANYSEARCH_KEYS", "").replace(";", ",").split(",") if k.strip()]
          print("key_count", len(keys))
          assert keys, "missing ANYSEARCH_KEYS"

          body = json.dumps({"query": "Claude V2EX Reddit 讨论", "max_results": 5}).encode()
          req = urllib.request.Request(
              "https://api.anysearch.com/v1/search", data=body, method="POST",
              headers={"Content-Type": "application/json",
                       "Authorization": "Bearer " + keys[0], "X-API-Key": keys[0],
                       "User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              status = resp.status
              payload = json.loads(resp.read().decode("utf-8"))
          results = (payload.get("data") or {}).get("results") or []
          print("direct_http_status", status, "api_code", payload.get("code"), "results", len(results))
          assert status == 200 and payload.get("code") == 0 and results, payload

          from monitor import search

          raw = search._post_json(search.ANYSEARCH_API, {"query": "Claude V2EX Reddit 讨论", "max_results": 8},
                                  {"Authorization": "Bearer " + keys[0], "X-API-Key": keys[0]})
          parsed = search._parse_search_json(raw, "Claude")
          print("direct_hits", len(parsed), [h.url for h in parsed[:3]])

          def mcp_off(*args, **kwargs):
              raise RuntimeError("EXA_DISABLED_FOR_ANYSEARCH_TEST")

          search._mcp_call = mcp_off
          hits, statuses = search.cloud_search("Claude")
          print("cloud_search_hits", len(hits))
          print("source_status", statuses.to_dict())
          assert statuses.name == "anysearch" and statuses.ok, statuses.to_dict()
          assert hits, "兜底返回 ok 但没有解析出命中"
          print("ANYSEARCH_FALLBACK_OK")
          PY
